# Baut bei jedem Push auf main (und bei Tags v*) ein Docker-Image
# und pusht es nach ghcr.io/<orga>/<repo>.
# Funktioniert in jedem Fork/Template-Klon ohne Anpassung.
name: Build & Push Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional: Deployment-Repo benachrichtigen -> automatischer Redeploy.
      # Braucht ein Secret DEPLOY_DISPATCH_TOKEN (PAT mit repo-Rechten auf das Deployment-Repo)
      # und die Variable DEPLOYMENT_REPO (z.B. "meine-orga/deployment").
      - name: Trigger deployment
        if: github.ref == 'refs/heads/main' && vars.DEPLOYMENT_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          gh api repos/${{ vars.DEPLOYMENT_REPO }}/dispatches \
            -f event_type=image-updated \
            -f "client_payload[source]=${{ github.repository }}"
